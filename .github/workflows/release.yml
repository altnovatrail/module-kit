# NovaTrail's shared release (R18 .github), pinned to a release of .github by SHA with its version
# beside it. RELEASE_LINE is the line the releases are numbered in; paths, what they are built from.
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_LINE: "0.3"

jobs:
  release:
    name: Release
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: altnovatrail/.github/.github/workflows/release.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15
    with:
      paths: |
        *.go
        :(exclude)*_test.go
        go.mod
        go.sum
        internal/schema/schemas/*.schema.json
        page/page.yaml
        justfile
        LICENSE
        .devcontainer/Dockerfile
        .github/workflows/release.yml
