# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both, and with them the composite action of .github that "Binaries /
# build" takes its image and Go caches by (R64). The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov (R16 .github). id-token: write is for its
  # coverage job alone, which asks for an OIDC token: a called workflow can only lower what this
  # job gives it.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  # The six binaries of a release, each run on a runner of its own system (Д6 in RUN.md; R41 in
  # docs/decisions.md). The build job builds them as release.yml does, by release-files in the
  # toolchain stage, which holds what the release's toolchain-core does (R62), with the samples
  # from spec's Go module, and runs the binary of linux/amd64 first: what it builds is the reference that every other runner's must equal, byte for byte.
  binaries-build:
    name: Binaries / build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What this job still holds to the release of .github it pins, in place of the copy of the
      # steps that the composite action took (R64 in docs/decisions.md): every reference to .github
      # at one SHA, so the action is go.yml's of the same release, with its file, image, folder and
      # keys; the mount of the Go caches in «Release files and samples», by the lines the header of
      # the action names for a caller's docker run; and the awk of «The stage of the release» to
      # that of the step «Toolchain stages» of the job toolchain of go.yml, which reads the
      # Dockerfile for the stage of the checks as release.yml reads it for the release (R62). A
      # move of .github that changes the mount or that reading fails here, and the pull request
      # takes it by hand.
      - name: As in the pinned .github
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Step $3 of job $2 of file $1, from its name to the next step or the end of the job,
          # without comments and blank lines.
          step() {
              awk -v job="  $2:" -v name="      - name: $3" '
                  $0 == job { j = 1; next }
                  j && /^  [^ #]/ { exit }
                  f && /^      [-#]/ { exit }
                  j && $0 == name { f = 1 }
                  f && $0 != "" && !/^[[:space:]]*#/ { print }
              ' "$1"
          }
          # The program of the awk of a step that reads .devcontainer/Dockerfile, its indentation aside.
          program() { sed -n "/awk '\$/,/^ *' \.devcontainer\/Dockerfile/p" | sed '1d;$d;s/^ *//'; }
          failed=0
          shas=$(grep -oh 'altnovatrail/\.github/[^@ ]*@[0-9a-f]\{40\}' .github/workflows/*.yml | cut -d@ -f2 | sort -u)
          if [ "$(printf '%s\n' "$shas" | grep -c .)" != 1 ]; then
              echo "::error::The references to altnovatrail/.github in .github/workflows/ are not at one SHA: $(echo $shas). Move them to one release (R58, R64)."
              exit 1
          fi
          sha=$shas
          gh api -H 'Accept: application/vnd.github.raw' \
              "repos/altnovatrail/.github/contents/.github/workflows/go.yml?ref=$sha" > "$RUNNER_TEMP/go.yml"
          gh api -H 'Accept: application/vnd.github.raw' \
              "repos/altnovatrail/.github/contents/.github/actions/toolchain/action.yml?ref=$sha" > "$RUNNER_TEMP/action.yml"
          # The lines of the header of the action that mount the Go caches and point Go into it.
          grep -E '^#[[:space:]]+--.*/go-cache' "$RUNNER_TEMP/action.yml" | sed 's/^#[[:space:]]*//' > "$RUNNER_TEMP/shared-mount" || true
          step .github/workflows/ci.yml binaries-build "Release files and samples" | sed 's/^[[:space:]]*//' > "$RUNNER_TEMP/own-run"
          mounted=$([ -s "$RUNNER_TEMP/shared-mount" ] && echo true || echo false)
          while IFS= read -r line; do
              grep -Fxq -- "$line" "$RUNNER_TEMP/own-run" || mounted=false
          done < "$RUNNER_TEMP/shared-mount"
          if [ "$mounted" = false ]; then
              cat "$RUNNER_TEMP/shared-mount"
              echo "::error::«Release files and samples» of the job Binaries / build does not mount the Go caches by the lines above of the header of the action toolchain at ${sha}: take them from there (R64)."
              failed=1
          fi
          step "$RUNNER_TEMP/go.yml" toolchain "Toolchain stages" | program > "$RUNNER_TEMP/shared-awk"
          step .github/workflows/ci.yml binaries-build "The stage of the release" | program > "$RUNNER_TEMP/own-awk"
          if [ ! -s "$RUNNER_TEMP/shared-awk" ] || ! diff "$RUNNER_TEMP/shared-awk" "$RUNNER_TEMP/own-awk"; then
              echo "::error::The awk of «The stage of the release» of the job Binaries / build is not that of «Toolchain stages» of the job toolchain of the shared go.yml at ${sha}: copy it from there (R62)."
              failed=1
          fi
          exit "$failed"

      # The shared release.yml builds the release's files in the stage toolchain-core, and this job
      # in toolchain, from the entry that go.yml fills (R47 .github). The two hold the same files
      # while toolchain is FROM toolchain-core with its SHELL alone, as in every copy of the kind
      # go: the step reads the Dockerfile by the awk of the step «Toolchain stages» of the job
      # toolchain of go.yml, which the step before it holds to it, and fails once toolchain holds
      # more than the core, so that this job then builds in the core, or when the Dockerfile cannot
      # be read (R62 in docs/decisions.md).
      - name: The stage of the release
        run: |
          status=0
          awk '
              { sub(/\r$/, "") }
              /^[[:space:]]*(#|$)/ { next }
              toupper($1) == "FROM" {
                  stage = (NF >= 4 && toupper($(NF - 1)) == "AS") ? tolower($NF) : ""
                  if (stage == "toolchain-core") core = 1
                  if (stage == "toolchain" && tolower($(NF - 2)) != "toolchain-core") adds = 1
                  next
              }
              stage == "toolchain" && toupper($1) != "SHELL" { adds = 1 }
              END { exit !(core && adds) }
          ' .devcontainer/Dockerfile || status=$?
          case $status in
              0)
                  echo "::error::The stage toolchain of .devcontainer/Dockerfile holds more than toolchain-core, in which release.yml builds the release's files: build «Release files and samples» in toolchain-core (R47 .github, R62)."
                  exit 1
                  ;;
              1) echo "The release's files: toolchain holds what toolchain-core does, and this job builds in it." ;;
              *)
                  echo "::error::awk gave ${status} on .devcontainer/Dockerfile, which the step could not read for its stages (R62)."
                  exit 1
                  ;;
          esac

      # The image of the stage toolchain and the caches of Go by the composite action of .github, at
      # the release the shared workflows are pinned to, which Dependabot moves with them in the group
      # shared-workflows (R49 .github; R64 in docs/decisions.md): the file, image, path and key of
      # go.yml, so the entry of the image is the one its jobs fill and read, and the Go caches by a
      # key of this job's own, the check binaries (R41 .github). What an exact hit gave, go mod verify
      # checks first, and an entry of another go.sum, by the prefix, loses its modules and keeps its
      # builds (T75 .github); only a push to main saves, the image at once and the Go caches by the
      # second call at the end of the job, after the binaries are built and their reference written.
      - name: Toolchain image and Go caches
        uses: altnovatrail/.github/.github/actions/toolchain@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33
        with:
          check: binaries

      # As go.yml runs a recipe: as the runner's user, with its home in /tmp, its Go caches the
      # folder above, and nothing of the step's environment.
      - name: Release files and samples
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain sh -c 'just release-files v0.0.0-ci && just binaries-samples binaries/samples'
          mv dist binaries/dist

      - name: Reference of linux/amd64
        run: .github/binaries.sh binaries/dist binaries/dist/module-kit_v0.0.0-ci_linux_amd64 binaries/samples binaries/reference

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: binaries/
          retention-days: 3
          if-no-files-found: error

      - name: Go caches into the cache
        uses: altnovatrail/.github/.github/actions/toolchain@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33
        with:
          check: binaries
          save: "true"

  binaries-run:
    name: Binaries / ${{ matrix.binary }}
    needs: binaries-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # Every system reports on its own, rather than the first one to fail cancelling the rest.
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, binary: linux_amd64 }
          - { runner: ubuntu-24.04-arm, binary: linux_arm64 }
          - { runner: macos-15-intel, binary: darwin_amd64 }
          - { runner: macos-15, binary: darwin_arm64 }
          - { runner: windows-2025, binary: windows_amd64.exe }
          - { runner: windows-11-arm, binary: windows_arm64.exe }
    defaults:
      run:
        shell: bash
    steps:
      # The script that runs a binary, and nothing else of the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/binaries.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: binaries

      - name: module-kit_v0.0.0-ci_${{ matrix.binary }}
        env:
          BINARY: module-kit_v0.0.0-ci_${{ matrix.binary }}
        run: .github/binaries.sh binaries/dist "binaries/dist/$BINARY" binaries/samples binaries/reference

  # The one check that the ruleset of main requires, which waits for every system: a matrix gives a
  # check for each of its jobs, whose names the ruleset would have to follow.
  binaries:
    name: Binaries
    needs: [binaries-build, binaries-run]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every binary on its own system
        env:
          BUILD: ${{ needs.binaries-build.result }}
          RUN: ${{ needs.binaries-run.result }}
        shell: bash
        run: |
          if [[ $BUILD != success || $RUN != success ]]; then
              echo "::error::The build gave ${BUILD}, and the runs of the binaries ${RUN}: the jobs above say which."
              exit 1
          fi
