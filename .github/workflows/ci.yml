# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them; the steps of the cache
# that "Binaries / build" copies from the shared go.yml move by hand, and the job checks them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@8311cbfc01082e9b196c0af8d7b49192115cc84c # v0.1.30

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@8311cbfc01082e9b196c0af8d7b49192115cc84c # v0.1.30

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@8311cbfc01082e9b196c0af8d7b49192115cc84c # v0.1.30

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov (R16 .github). id-token: write is for its
  # coverage job alone, which asks for an OIDC token: a called workflow can only lower what this
  # job gives it.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@8311cbfc01082e9b196c0af8d7b49192115cc84c # v0.1.30

  # The six binaries of a release, each run on a runner of its own system (Д6 in RUN.md; R41 in
  # docs/decisions.md). The build job builds them as release.yml does, by release-files in the
  # toolchain stage, with the samples from spec's Go module, and runs the binary of linux/amd64
  # first: what it builds is the reference that every other runner's must equal, byte for byte.
  binaries-build:
    name: Binaries / build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The steps «Toolchain image…» and «Go caches…» below are a copy of those of the job arm64 of
      # the shared go.yml, the one job there that takes the image on its own rather than from the
      # job toolchain, which a job of the caller cannot need; only the check in the key of the Go
      # caches is this job's, binaries. Dependabot moves the SHA of go.yml, not the copy: this step
      # holds each of the six steps, comments and blank lines aside, and the mount of the Go caches
      # in «Release files and samples» to the go.yml of the SHA the job "Go" pins, so that a move
      # of .github that changed them fails here, and the pull request takes the new steps by hand
      # (R58, R61 in docs/decisions.md).
      - name: Cache steps as in the shared go.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Step $3 of job $2 of file $1, from its name to the next step or the end of the job,
          # without comments and blank lines.
          step() {
              awk -v job="  $2:" -v name="      - name: $3" '
                  $0 == job { j = 1; next }
                  j && /^  [^ #]/ { exit }
                  f && /^      [-#]/ { exit }
                  j && $0 == name { f = 1 }
                  f && $0 != "" && !/^[[:space:]]*#/ { print }
              ' "$1"
          }
          sha=$(grep -o 'altnovatrail/\.github/\.github/workflows/go\.yml@[0-9a-f]\{40\}' .github/workflows/ci.yml | cut -d@ -f2)
          gh api -H 'Accept: application/vnd.github.raw' \
              "repos/altnovatrail/.github/contents/.github/workflows/go.yml?ref=$sha" > "$RUNNER_TEMP/go.yml"
          failed=0
          for name in "Toolchain image from the cache" "Toolchain image" "Toolchain image into the cache" \
              "Go caches from the cache" "Go caches" "Go caches into the cache"; do
              step "$RUNNER_TEMP/go.yml" arm64 "$name" | sed 's/^\( *key: go-.*\)-arm64-/\1-binaries-/' > "$RUNNER_TEMP/shared-step"
              step .github/workflows/ci.yml binaries-build "$name" > "$RUNNER_TEMP/own-step"
              if [ ! -s "$RUNNER_TEMP/shared-step" ] || ! diff "$RUNNER_TEMP/shared-step" "$RUNNER_TEMP/own-step"; then
                  echo "::error::The step «${name}» of the job Binaries / build is not that of the job arm64 of the shared go.yml at ${sha}: copy it from there, or record why not (R58, R61)."
                  failed=1
              fi
          done
          # The lines of the recipe's docker run in arm64 that mount the Go caches and point Go into them.
          step "$RUNNER_TEMP/go.yml" arm64 ci-test | grep -F /go-cache > "$RUNNER_TEMP/shared-mount" || true
          step .github/workflows/ci.yml binaries-build "Release files and samples" > "$RUNNER_TEMP/own-run"
          mounted=$([ -s "$RUNNER_TEMP/shared-mount" ] && echo true || echo false)
          while IFS= read -r line; do
              grep -Fxq -- "$line" "$RUNNER_TEMP/own-run" || mounted=false
          done < "$RUNNER_TEMP/shared-mount"
          if [ "$mounted" = false ]; then
              cat "$RUNNER_TEMP/shared-mount"
              echo "::error::«Release files and samples» of the job Binaries / build does not mount the Go caches as the step ci-test of the job arm64 of the shared go.yml at ${sha}, by the lines above: take them from there (R61)."
              failed=1
          fi
          exit "$failed"

      # The toolchain stage from the cache of GitHub Actions, by the steps of the job arm64 of the
      # shared go.yml of v0.1.30 (R42 .github; the 2026-11-09 amendment to R31 in spec; R58, R61 in
      # docs/decisions.md): the same file, image, path and key as every job of go.yml and
      # documents.yml, so the entry is the one they fill and read, and the image is built from the
      # Dockerfile only on a miss. Only a push to main writes and saves the file, and a pull request
      # reads main's entry.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        env:
          SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # The caches of Go — the modules and the builds of the six targets — from the same cache, as
      # in the job arm64 of go.yml, by a key of this job's own, with the check binaries (R41 .github):
      # what the cache gave, go mod verify checks first, and only a push to main saves, at the end
      # of the job.
      - name: Go caches from the cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-binaries-${{ hashFiles('.devcontainer/Dockerfile') }}-${{ hashFiles('**/go.sum') }}

      - name: Go caches
        env:
          RESTORED: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: |
          cache=$RUNNER_TEMP/go-cache
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"
          if [ -z "$RESTORED" ]; then
              echo "Go caches: none in the cache; the job starts with empty ones."
              exit 0
          fi
          verified=false
          if git ls-files -z -- ':(glob)**/go.mod' ':(exclude,glob)**/testdata/**' ':(exclude,glob)**/vendor/**' \
              ':(exclude,glob)**/.*/**' ':(exclude,glob)**/_*/**' > "$RUNNER_TEMP/go-modules"; then
              modules=()
              while IFS= read -r -d '' file; do
                  modules+=("$(dirname -- "$file")")
              done < "$RUNNER_TEMP/go-modules"
              if [ "${#modules[@]}" = 0 ]; then
                  echo "Go caches: ${RESTORED}, with no module of the repository to verify them by."
                  verified=true
              elif docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
                  --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
                  --volume "$PWD:/work" --volume "$cache:/go-cache" --workdir /work \
                  novatrail-toolchain bash -c 'for module in "$@"; do go -C "$module" mod verify || exit; done' bash "${modules[@]}"; then
                  echo "Go caches: ${RESTORED}, its modules verified."
                  verified=true
              fi
          fi
          if [ "$verified" = true ]; then
              find "$cache/build" "$cache/lint" -type f -exec touch -c -- {} +
              exit 0
          fi
          echo "::warning::The Go caches of ${RESTORED} did not pass go mod verify: they are deleted, and the job downloads and builds without them. An entry that fails on every run stays until it is deleted (gh cache delete) or go.sum or the Dockerfile changes."
          chmod -R u+w -- "$cache"
          rm -rf -- "$cache"
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"

      # As go.yml runs a recipe: as the runner's user, with its home in /tmp, its Go caches the
      # folder above, and nothing of the step's environment.
      - name: Release files and samples
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain sh -c 'just release-files v0.0.0-ci && just binaries-samples binaries/samples'
          mv dist binaries/dist

      - name: Reference of linux/amd64
        run: .github/binaries.sh binaries/dist binaries/dist/module-kit_v0.0.0-ci_linux_amd64 binaries/samples binaries/reference

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: binaries/
          retention-days: 3
          if-no-files-found: error

      # The Go caches into the cache, as in the job arm64 of go.yml, once the binaries are built and
      # their reference written: only a push to main, and only on a miss (R41 .github).
      - name: Go caches into the cache
        if: steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  binaries-run:
    name: Binaries / ${{ matrix.binary }}
    needs: binaries-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # Every system reports on its own, rather than the first one to fail cancelling the rest.
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, binary: linux_amd64 }
          - { runner: ubuntu-24.04-arm, binary: linux_arm64 }
          - { runner: macos-15-intel, binary: darwin_amd64 }
          - { runner: macos-15, binary: darwin_arm64 }
          - { runner: windows-2025, binary: windows_amd64.exe }
          - { runner: windows-11-arm, binary: windows_arm64.exe }
    defaults:
      run:
        shell: bash
    steps:
      # The script that runs a binary, and nothing else of the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/binaries.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: binaries

      - name: module-kit_v0.0.0-ci_${{ matrix.binary }}
        env:
          BINARY: module-kit_v0.0.0-ci_${{ matrix.binary }}
        run: .github/binaries.sh binaries/dist "binaries/dist/$BINARY" binaries/samples binaries/reference

  # The one check that the ruleset of main requires, which waits for every system: a matrix gives a
  # check for each of its jobs, whose names the ruleset would have to follow.
  binaries:
    name: Binaries
    needs: [binaries-build, binaries-run]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every binary on its own system
        env:
          BUILD: ${{ needs.binaries-build.result }}
          RUN: ${{ needs.binaries-run.result }}
        shell: bash
        run: |
          if [[ $BUILD != success || $RUN != success ]]; then
              echo "::error::The build gave ${BUILD}, and the runs of the binaries ${RUN}: the jobs above say which."
              exit 1
          fi
