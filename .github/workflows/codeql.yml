# CodeQL over the repository's workflows and its languages (R09 .github), pinned to a release of
# .github. The job gives the shared workflow what it needs to upload its results.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@26f61993abadd564cce5e0498b31c686a61f9646 # v0.1.3
    # Go is read from a build, with the Go of the toolchain stage of .devcontainer/Dockerfile (R06).
    with:
      languages: go
