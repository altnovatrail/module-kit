# CodeQL over the repository's workflows and its languages (R09 .github), pinned to a release of
# .github. The job gives the shared workflow what it needs to upload its results.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@1704f782e76cee50ea5392cc0ea0d4b76c4b3672 # v0.1.32
    # Go is read from a build, with the Go of the toolchain-core stage of .devcontainer/Dockerfile,
    # which toolchain is built from (R06, R62).
    with:
      languages: go
