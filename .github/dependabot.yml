version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The Go modules the code is built from (R04). Go itself, in the Dockerfile, and the tools the
  # recipes run by `go run` at an exact version are not among them: those are raised by hand.
  # Neither is .devcontainer/gopls/, the lock file of gopls: it is the go kind's of spec's
  # repo-template, and a move to a tag of spec raises it together with GOPLS_VERSION in the
  # Dockerfile. Dependabot alerts and security updates still read that go.mod; a security update
  # that raises gopls itself fails ci-lint until GOPLS_VERSION moves with it (R19 and R51 in
  # docs/decisions.md).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # spec's Go modules move together with the spec submodule, to its tag, in a task of its own, and
    # ci-lint holds them to it (R64 in spec; R20 in docs/decisions.md): a tag of spec comes out with
    # every change to its documents, so Dependabot does not raise them.
    # go.starlark.net is part of the format: its version counts the steps of the format's limits, and
    # raising it is a new version of the format, so it moves with a tag of spec whose format names
    # another (R88 in spec; R11 and R28 in docs/decisions.md).
    ignore:
      - dependency-name: github.com/altnovatrail/spec
      - dependency-name: github.com/altnovatrail/spec/contracts
      - dependency-name: go.starlark.net
