version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # Every reference to a shared workflow of .github in one pull request, to one release, and the
      # composite action that "Binaries / build" takes with them: Dependabot names each
      # altnovatrail/.github/.github/workflows/<file>.yml and the action
      # altnovatrail/.github/.github/actions/toolchain.
      shared-workflows:
        patterns: ["altnovatrail/.github/*"]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The Go modules the code is built from. Go itself, in the Dockerfile, and the tools the
  # recipes run by `go run` at an exact version are not among them: those are raised by hand.
  # Neither is .devcontainer/gopls/, the lock file of gopls: it is the go kind's of spec's
  # repo-template, and a move to a tag of spec raises it together with GOPLS_VERSION in the
  # Dockerfile. Dependabot alerts and security updates still read that go.mod; a security update
  # that raises gopls itself fails ci-lint until GOPLS_VERSION moves with it.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # spec's Go modules move together with the spec submodule, to its tag, in a task of its own, and
    # ci-lint holds them to it (R20): a tag of spec comes out with every change to its
    # documents, so Dependabot does not raise them.
    # go.starlark.net is part of the format: its version counts the steps of the format's limits, and
    # raising it is a new version of the format, so it moves with a tag of spec whose format names
    # another (R28).
    ignore:
      - dependency-name: github.com/altnovatrail/spec
      - dependency-name: github.com/altnovatrail/spec/contracts
      - dependency-name: go.starlark.net
